<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Missão Interativa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="caixa-principal">
    <h1 class="titulo">Missão Interativa</h1>

    <div class="tela-inicial">
      <p class="texto-inicial">
        Você está prestes a embarcar em uma missão cheia de escolhas.
        Cada decisão mudará o rumo da sua história. Está pronto?
      </p>
      <button class="iniciar-btn">Iniciar missão</button>
    </div>

    <div class="caixa-perguntas"></div>
    <div class="caixa-alternativas"></div>

    <div class="caixa-resultado">
      <p class="texto-resultado"></p>
      <button class="novamente-btn">Jogar novamente</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
